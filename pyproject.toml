[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-nest"
version = "0.1.0"
description = "Experimental developmental AI environment for studying learning, memory, self-models, and consciousness-related behavior."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.2",
    "pygame>=2.5",
]

[project.scripts]
cerberus-nest = "cerberus_nest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
